services:
  db:
    image: pgvector/pgvector:pg16
    container_name: aml-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres   # local development only
      POSTGRES_DB: aml
      TZ: UTC
      PGTZ: UTC
    ports:
      - "5433:5432"   # host 5433: a native Windows Postgres may own 5432
    volumes:
      - aml_pgdata:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d aml"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  aml_pgdata:
