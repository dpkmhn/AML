services:
  db:
    image: pgvector/pgvector:pg16
    container_name: aml-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres   # local development only
      POSTGRES_DB: aml
      TZ: UTC
      PGTZ: UTC
    ports:
      - "5433:5432"   # host 5433: a native Windows Postgres may own 5432
    volumes:
      - aml_pgdata:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d aml"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: .
    container_name: aml-api
    command: uvicorn app.api.main:app --host 0.0.0.0 --port 8000
    env_file: .env
    environment:
      # inside the compose network the database is db:5432, not localhost:5433
      DATABASE_URL: postgresql+psycopg://postgres:postgres@db:5432/aml
      DATABASE_URL_RO: postgresql+psycopg://copilot_ro:copilot_ro@db:5432/aml
      DATABASE_URL_RW: postgresql+psycopg://copilot_rw:copilot_rw@db:5432/aml
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  ui:
    build: .
    container_name: aml-ui
    command: streamlit run ui/app.py --server.address 0.0.0.0 --server.port 8501
    environment:
      API_URL: http://api:8000
    ports:
      - "8501:8501"
    depends_on:
      - api

volumes:
  aml_pgdata:
