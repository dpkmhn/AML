server {
    listen 80;
    root /usr/share/nginx/html;

    # POST /cases runs the graph to the review: allow it time
    location /api/ {
        proxy_pass http://api:8000/;
        proxy_read_timeout 180s;
        proxy_set_header Host $host;
    }

    location / {
        try_files $uri /index.html;
    }
}
